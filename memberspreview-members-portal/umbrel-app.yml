manifestVersion: 1
id: memberspreview-members-portal
storage:
  dataRoot: data
category: media
name: MPS — Media Payment System
version: "1.0.1"
tagline: Media, memberships and payments in one place
description: >-
  MPS — Media Payment System. Manage media-server invitations, members and optional billing integrations.
  On first launch, unlock setup with username owner and the password shown by
  Umbrel, then choose your permanent owner account and enrol an authenticator.


  Emby, Ombi, SMTP and billing services require your own servers or accounts.
  No integrations are enabled automatically. This preview has not been certified
  for live billing. Public member access requires separate HTTPS deployment;
  the default package stays protected by Umbrel login.

  Includes ten enabled members free; linked media administrators count toward this limit. Larger installations require a
  GBP 5/month MPS unlock subscription for up to three applications. The licence
  service requires verified email and MFA. Source-available no-resale terms apply;
  operating paid membership services is permitted. Back up before upgrading.

releaseNotes: "Licensing security update: installation proofs, rotating sessions, protected revocation state and trusted lease expiry. Paid access requires an online check after restart. Licence downgrade now disables excess linked Emby access while retaining member data; linked media administrators count toward the limit. Back up the entire app data before updating and preserve the existing installation/state. Windows and Linux installer downloads are not included. Release notes: https://github.com/matty03072/MPS-Media-Payment-System/releases/tag/v1.0.1"
