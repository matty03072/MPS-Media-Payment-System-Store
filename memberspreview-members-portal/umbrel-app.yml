category: media
name: MPS — Media Payment System
version: "1.0.4"
tagline: Media, memberships and payments in one place
description: >-
  MPS — Media Payment System. Manage media-server invitations, members and optional billing integrations.
  On first launch, unlock setup with username owner and the password shown by
  Umbrel, then choose your permanent owner account and enrol an authenticator.


  After a member completes their invitation and verifies their email, MPS automatically
  sets up their invited Emby and Jellyfin server accounts with selected library access,
  uses Emby Connect only when Emby access needs it, and creates or links their Ombi account.
  Once your service connections are configured, routine member setup needs no manual administration.
  Membership/payment requirements still apply; provider email verification or conflicting accounts may need attention.

  Emby, Jellyfin, Ombi, SMTP and billing services require your own servers or accounts.
  No integrations are enabled automatically. This community package has not been certified
  for live billing. Public member access requires separate HTTPS deployment;
  the default package stays protected by Umbrel login.

  Includes ten enabled members free; linked media administrators count toward this limit. Larger installations require a
  GBP 5/month MPS unlock subscription for up to three applications. The licence
  service requires verified email and MFA. MPS no-resale terms apply; application source is private;
  operating paid membership services is permitted. Back up before upgrading.

  Free and licensed installations periodically report an installation identifier, app version and activity time
  to measure active installations. No member details, media activity or service credentials are included.
  Reporting failures do not change free-tier access.

releaseNotes: "New 1.0.4 release: adds Jellyfin server accounts and per-server access, separate Sonarr/Radarr Configuration, optional Media Managers, and updated member/admin guides. Existing managed 1.0.3 installations update in place; back up app data and do not uninstall. https://github.com/matty03072/MPS-Media-Payment-System-Store/blob/main/docs/RELEASE-1.0.4.md"
